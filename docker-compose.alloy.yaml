services:
  site:
    image: nginx:1.27-alpine
    network_mode: host
    restart: unless-stopped
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./.alloy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 10
